name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-fund --no-audit
      - name: Audit production dependencies
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - name: Run tests
        run: npm run test:web
      - name: TypeScript check
        run: npm run typecheck:web
      - name: Production static build
        run: npm run build:web
        env:
          NEXT_PUBLIC_SITE_URL: https://flythebg.com
          NEXT_PUBLIC_APP_NAME: FlytheBG
          NEXT_PUBLIC_UPLOAD_MAX_MB: 12
          NEXT_PUBLIC_ADSENSE_ENABLED: true
          NEXT_PUBLIC_ADSENSE_CLIENT: ca-pub-7486274445029717
          NEXT_PUBLIC_MONETAG_ENABLED: true
